[package]
name = "sunshine-client"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls"] }
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
sarmg-client-cli = { git = "https://github.com/isarmg/sarmg-foundation-client.git", rev = "2fa783a1eb7aefde8e54e328f91d67aa9e1eb890", version = "=0.9.1" }
sarmg-client-runtime = { git = "https://github.com/isarmg/sarmg-foundation-client.git", rev = "2fa783a1eb7aefde8e54e328f91d67aa9e1eb890", version = "=0.9.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sunshine-client-protocol = { git = "https://github.com/isarmg/sunshine-manager-server.git", rev = "dc1ce5912422baa3e52c369c2ce70572e91a656a", version = "=0.2.0" }
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-rustls = "0.26"
rustls-platform-verifier = "0.7"
url = "2"
zeroize = { version = "1", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
sarmg-client-fs-safety = { git = "https://github.com/isarmg/sarmg-foundation-client.git", rev = "2fa783a1eb7aefde8e54e328f91d67aa9e1eb890", version = "=0.9.1" }

[target.'cfg(target_os = "windows")'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
windows-service = "=0.8.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
